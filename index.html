/span>", "opts": ["Dlhodobá únava, bolesti kĺbov", "Svalová únava, ale bez bolestí", "Rýchla regenerácia do 24 hodín", "Výborne, regenerujem bez problémov"], "scores": [15, 55, 85, 100], "note": "Rýchlosť a kvalita regenerácie ukazujú, či trénuješ v súlade s tým, čo telo aktuálne zvláda."}, {"p": "telo", "type": "condbranch", "q": "Ako často ťa obmedzí <span>bolesť alebo zranenie?</span>", "opts": ["Často – niekoľkokrát za mesiac", "Občas – niekoľkokrát za rok", "Zriedka – raz za rok alebo menej", "Takmer nikdy"], "scores": [15, 45, 75, 100], "flag": true, "note": "Opakujúca sa bolesť má takmer vždy jednu koreňovú príčinu – nie je to náhoda.", "sub": {"q": "Kde ťa bolesť <span>najčastejšie</span> obmedzuje?", "opts": ["Koleno", "Achilovka / lýtko", "Bedro / panva", "Chodidlo / členok", "Chrbát"], "note": "Táto informácia nám pomôže presnejšie zacieliť odporúčania v mailovom reporte."}}, {"p": "poroz", "type": "selfcheck", "q": "Čo je hlavná príčina <span>tvojej stagnácie?</span>", "opts": ["Technika – neviem správne behať", "Tréning – nemám systém", "Telo – chýba mi sila a stabilita", "Neviem – preto som tu"], "note": "Táto otázka porovná tvoj odhad s tým, čo naozaj ukázali tvoje predchádzajúce odpovede."}], "PILLAR_ACTIONS": {"vstup": ["Zaveď tréningové zóny podľa maximálneho pulzu", "Drž pravidlo 80/20 – 80 % objemu skutočne naľahko", "Zaraď pravidelne úsek nad ANP, nie len náhodne"], "tech": ["Nechaj si analyzovať techniku videorozborom u trénera", "Cieľ pri došľape: noha pod bokmi, nie pred telom", "Zapracuj na kadencii – cieľ okolo 170–180 krokov/min"], "tren": ["Nastav si periodizovaný plán namiesto tréningu podľa pocitu", "Drž si aspoň 80 % behov skutočne ľahkých", "Raz za pár týždňov sa pozri spätne, čo si trénoval, a uprav podnet"], "telo": ["Zaraď 2× týždenne silový tréning zameraný na bežca", "Sleduj signály tela – bolesť je varovanie, nie výzva na pokračovanie", "Daj regenerácii toľko priestoru, koľko dávaš tréningu"]}, "TEASER_TEXTS": {"vstup": "Tvoje tréningy pravdepodobne nerozvíjajú presne to, čo si myslíš – celý rozbor prečo nájdeš v maile.", "tech": "Tvoja technika má rezervu, ktorá ťa dlhodobo stojí energiu aj rýchlosť – detaily posielame mailom.", "tren": "Spôsob, akým si nastavuješ tréning, ťa pravdepodobne brzdí viac, než tušíš – rozbor je v maile.", "telo": "Tvoje telo pravdepodobne nie je pripravené na záťaž, ktorú mu dávaš – prečo, sa dozvieš v maile."}, "PILLAR_DESC": {"0": "Trénuješ bez jasnej kontroly nad tým, v akých pásmach väčšinu času behávaš. To je presne dôvod, prečo môžeš behať pravidelne a napriek tomu stagnovať – telo dostáva stále rovnaký podnet.", "1": "Tvoja technika má rezervu, ktorú si sám ťažko všimneš. Bez videa alebo odborného pohľadu sa drobné chyby v došľape aj držaní tela opakujú krok za krokom, tréning za tréningom.", "2": "Spôsob, akým si nastavuješ intenzitu a objem, ťa pravdepodobne brzdí viac, než tušíš. Bez jasnej štruktúry sa dá udržať forma, ale ťažko sa dá systematicky zlepšovať.", "3": "Tvoje telo pravdepodobne nedostáva podporu, akú potrebuje na to, aby uneslo záťaž, ktorú mu dávaš – to zvyšuje riziko, že ťa zastaví bolesť skôr než forma."}, "PROFILE_NAME": {"0": "Bežec bez systému v pulze", "1": "Bežec bez spätnej väzby", "2": "Bežec bez tréningového systému", "3": "Bežec s rizikom zranenia"}};

var PILLAR_LONG = {"WEAKEST": {"vstup": {"p": ["Behávaš pravidelne, ale tvoje tempo sa deň čo deň mení podľa počasia, únavy, kopcov aj toho, ako sa práve cítiš – a keďže nesleduješ pulz, netušíš, či konkrétny tréning naozaj niečo rozvíja, alebo len opakuje podnet, na ktorý si telo už dávno zvyknuté.", "To je pravdepodobne presne dôvod, prečo môžeš mať pocit, že drieš, no výsledky neprichádzajú tak, ako by mali. Väčšina tvojich behov zrejme padá do jedného úzkeho pásma námahy – dosť rýchlo na to, aby si sa unavil, no nedosť systematicky na to, aby si budoval vytrvalostnú základňu, alebo sa učil spracovávať únavu pri vysokej intenzite.", "To vysvetľuje aj to, prečo občas cítiš nezvyčajne „tvrdé“ nohy skôr, než by si čakal, alebo prečo sa tvoj progres v posledných mesiacoch spomalil – telu jednoducho chýba dostatočne rôznorodý podnet, na ktorý by sa muselo adaptovať."], "t": "V akých pásmach tráviť najviac času a ako má vyzerať tvoj najbližší tréningový mesiac, nájdeš nižšie v maile."}, "tech": {"p": ["Pri behu pravdepodobne dopadáš na pätu ďaleko pred ťažiskom tela (tzv. heel strike) – každý takýto krok funguje ako malá brzda, telo musí prekonať vlastný brzdný náraz, kým sa vôbec posunie dopredu. Pri tisíckach krokov za tréning sa táto strata energie výrazne spočíta.", "Súvisí s tým aj postoj – ak sú ramená a hlava pred ťažiskom namiesto nad ním, telo kompenzuje nestabilitu zbytočným napätím, ktoré ťa unavuje skôr, než by malo. Rozdiely sú v milimetroch, preto si to bežec bez videa zvyčajne neuvedomí a opakuje roky.", "Zlá technika je v našich dátach spojená s výrazne vyšším rizikom typických zranení (kolená, achilovky, chodidlá), pretože rovnaký nesprávny náraz sa opakuje pri každom kroku, tisíckrát za tréning."], "t": "Presný rozbor tvojho došľapu, kadencie a postoja – aj pod únavou – dostaneš v maile."}, "tren": {"p": ["Tvoje tréningy zrejme nemajú jasnú štruktúru – rovnaká dĺžka aj intenzita, týždeň čo týždeň, bez cieleného striedania náročnejších a ľahších období. Telo sa ale nezlepšuje počas samotného tréningu, ale až počas regenerácie po ňom – tento princíp (superkompenzácia) podľa našich dát nechápe až 92 % bežcov, ktorí trénujú sami.", "Bez plánovaných regeneračných dní (aeróbny tréning 0,5–2 dni, náročnejší anaeróbny 1–3 dni podľa úrovne) sa telo nestíha zotaviť skôr, než príde ďalší podnet – výsledkom nie je progres, ale kumulovaná únava, ktorá sa prejaví ako stagnácia alebo zranenie.", "Paradoxne to vyzerá ako snaha – trénuješ pravidelne, možno aj viac než predtým – no bez systému, ktorý strieda záťaž a zotavenie, sa táto snaha nepremieňa na výkon."], "t": "Presne rozvrhnutý tréningový cyklus je súčasťou tvojho plného výsledku."}, "telo": {"p": ["Posilňovanie do tréningu pravdepodobne buď nezaraďuješ vôbec, alebo len nepravidelne. Pre bežca to nie je doplnok navyše – šľachy (najmä achilovka) fungujú pri behu ako pružina, ktorá pri dopade ukladá a pri odraze vracia časť energie kroku. Bez posilňovania táto „pružina“ postupne stráca pevnosť a beh je namáhavejší, než musí byť.", "Súvisí s tým aj riziko zranenia – naprieč našimi dátami je až 78 % typických bežeckých zranení spôsobených kombináciou zlej techniky a nedostatočne pripraveného tela na opakovanú záťaž, nie jednorazovou nehodou.", "Nejde o to „napumpovať“ svaly na vzhľad, ale posilniť presne tie pozície, ktoré beh vyžaduje – stabilitu bedra, tuhosť členka, aktiváciu sedu pri odraze."], "t": "Ktoré konkrétne pozície a cviky potrebuješ ty, nájdeš v plnom výsledku."}}, "OTHER": {"vstup": {"p": ["Toto vyšlo ako jedna z tvojich silnejších stránok. 80 % behov by malo prebiehať v nízkej intenzite (60–75 % max. TF) – tam telo buduje aeróbny základ pre rýchlejšie tréningy. Zvyšných 20 % patrí vyššej intenzite, ktorá trénuje prácu s laktátom a posúva strop výkonu."], "t": "Presné pulzové pásma pre tvoju úroveň nájdeš v plnom výsledku."}, "tech": {"p": ["Nejde o uhol predklonu, ale o to, či chodidlo dopadá pod ťažiskom alebo pred ním. Súvisí s tým kadencia – okolo 170–180 krokov/min prirodzene skracuje krok. Práca rúk pomáha stabilizovať trup a najviac sa rozpadá pod únavou."], "t": "Preto robíme analýzu nielen na čerstvo, ale aj po zaťažení."}, "tren": {"p": ["Väčšina tvojich behov je „medzi“ – nie dosť ľahká na regeneráciu, nie dosť náročná na rozvoj. Telo sa zlepšuje počas regenerácie (superkompenzácia), nie počas tréningu – bez striedania náročnosti sa adaptačná krivka vyplošťuje, aj keď objem rastie."], "t": "V TP Running Method delíme tréning do fáz presne preto, aby telo dostávalo nové podnety."}, "telo": {"p": ["Nejde o veľkosť svalov, ale o tuhosť šliach – fungujú ako pružina, ktorá vracia časť energie kroku. Druhá vec sú asymetrie ľavá/pravá strana – pri tisíckach krokov sa aj malý rozdiel zväčšuje a zvyčajne je za tým, prečo sa zranenie objaví vždy na tej istej strane."], "t": "Cielené cviky na tvoje slabé miesto určíme len po pohľade na to, ako presne beháš."}, "poroz": {"p": ["Ukazuje, ako dobre vieš čítať signály tela – únavu, kedy naozaj spomaliť a kedy len prekonávaš pohodlie. Nie je to vrodené, je to zručnosť, ktorá rastie s tým, ako sleduješ dáta a spájaš si ich s tréningom."], "t": "Presne túto schopnosť rozvíjame v pravidelných konzultáciách s trénerom."}}};

async function sha256Hex(str){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}

function drawRadar(svg, pcts){
  var ns='http://www.w3.org/2000/svg';
  function el(tag,attrs){ var e=document.createElementNS(ns,tag); Object.keys(attrs).forEach(function(k){e.setAttribute(k,attrs[k]);}); return e; }
  var cx=230, cy=160, maxR=72;
  var labels = ORDER.map(function(k){ return PILLARS[k].label; });
  [0.33,0.66,1.0].forEach(function(ring){
    var pts = labels.map(function(l,idx){ var pt=polar(cx,cy,maxR*ring, idx*72); return pt.x+','+pt.y; }).join(' ');
    svg.appendChild(el('polygon',{points:pts, fill:'none', stroke:'#242424', 'stroke-width':'1'}));
  });
  labels.forEach(function(l,idx){
    var pt=polar(cx,cy,maxR, idx*72);
    svg.appendChild(el('line',{x1:cx,y1:cy,x2:pt.x,y2:pt.y, stroke:'#242424', 'stroke-width':'1'}));
  });
  var dataPts = pcts.map(function(p,idx){ var pt=polar(cx,cy,maxR*(p/100), idx*72); return pt.x+','+pt.y; }).join(' ');
  svg.appendChild(el('polygon',{points:dataPts, fill:ACC+'26', stroke:ACC, 'stroke-width':'2', 'stroke-linejoin':'round'}));
  pcts.forEach(function(p,idx){
    var pt=polar(cx,cy,maxR*(p/100), idx*72);
    svg.appendChild(el('circle',{cx:pt.x,cy:pt.y,r:'3.5', fill:ACC}));
  });
  var minScore = Math.min.apply(null, pcts);
  labels.forEach(function(l,idx){
    var pt=polar(cx,cy,maxR+58, idx*72);
    var isMin = pcts[idx]===minScore;
    var anchor = Math.abs(pt.x-cx)<5 ? 'middle' : (pt.x>cx ? 'start' : 'end');
    var t=el('text',{x:pt.x,y:pt.y,'text-anchor':anchor,'dominant-baseline':'middle','font-size':'9.5', fill:isMin?ACC:'#888','font-family':'inherit','font-weight':isMin?'600':'400'});
    t.textContent=l;
    svg.appendChild(t);
  });
}

var userName='', userEmail='', userEmailHash='';
var weakestIdx = 0, pctsGlobal = [0,0,0,0,0];

function renderPillarsRow(){
  return ORDER.map(function(k){
    var p = PILLARS[k];
    return '<div style="display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;border:1px solid '+ACC+';color:'+ACC+';background:'+ACC+'12;font-size:10.5px;">'+
      '<i class="ti ti-check" style="font-size:12px;"></i><span>'+p.label+'</span></div>';
  }).join('');
}

function renderScoreList(pcts){
  var minScore = Math.min.apply(null, pcts);
  return ORDER.map(function(k, idx){
    var p = PILLARS[k]; var score = pcts[idx]; var isMin = score===minScore;
    return '<div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">'+
        '<div style="display:flex;align-items:center;gap:6px;color:'+(isMin?'#fff':'#aaa')+';font-size:11.5px;"><i class="ti '+p.icon+'" style="font-size:12px;color:'+(isMin?ACC:'#666')+';"></i>'+p.label+'</div>'+
        '<div style="color:'+(isMin?ACC:'#888')+';font-size:11.5px;font-weight:600;font-family:var(--font-mono);">'+score+'</div>'+
      '</div>'+
      '<div style="height:5px;background:#1e1e1e;border-radius:3px;overflow:hidden;">'+
        '<div style="height:100%;width:'+score+'%;background:'+(isMin?ACC:'#3d3d3d')+';border-radius:3px;"></div>'+
      '</div></div>';
  }).join('');
}

function renderLongParas(paras, color){
  return paras.map(function(p){
    return '<div style="color:'+color+';font-size:12.5px;line-height:1.65;margin-bottom:10px;">'+p+'</div>';
  }).join('');
}
function rankInfo(pcts, idx){
  var sorted = pcts.slice().sort(function(a,b){return a-b;});
  var val = pcts[idx];
  if(val === sorted[sorted.length-1]) return 'best';
  if(val === sorted[1]) return 'second_worst';
  return null;
}

      '<a href="https://stefanoravec2.github.io/diagnostika/" style="display:inline-block;background:'+ACC+';color:#06110f;padding:13px 26px;border-radius:9px;font-weight:700;text-decoration:none;font-size:14px;">Spustiť diagnostiku →</a>'+
    '</div>';
}

          '<div style="color:#ccc;font-size:14px;">'+profileName+'</div>'+
        '</div>'+
        '<div style="color:#666;font-size:11.5px;margin-bottom:20px;">Porovnávame ťa s dátami 1200+ bežcov, ktorých trénoval TP Running Method.</div>'+
        '<div style="display:flex;justify-content:center;margin:6px 0 8px;"><svg id="radar" width="380" height="281" viewBox="0 0 460 340"></svg></div>'+
        '<div style="display:flex;gap:11px;margin-top:8px;padding:18px 19px;background:#141210;border:1px solid #2a2119;border-radius:12px;">'+
          '<i class="ti ti-target-arrow" style="font-size:18px;color:'+ACC+';min-width:18px;margin-top:2px;"></i>'+
          '<div>'+
            '<div style="color:#fff;font-size:13.5px;font-weight:600;margin-bottom:9px;">Hlavné obmedzenie: '+weakestLabel+' ('+pcts[weakest]+'/100)</div>'+
            renderLongParas(wc.p, '#aaa')+
            '<div style="color:#777;font-size:12px;line-height:1.6;font-style:italic;">'+wc.t+'</div>'+
            '<div style="display:flex;gap:9px;margin-top:14px;align-items:center;">'+
              '<div style="width:24px;height:24px;min-width:24px;border-radius:50%;background:'+ACC+'20;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:'+ACC+';font-weight:600;">'+ex.i+'</div>'+
              '<div style="color:#888;font-size:11.5px;">'+ex.n+' · '+ex.r+'</div>'+
            '</div>'+
          '</div>'+
        '</div>'+

      '<div style="flex:0 0 240px;background:#111;border:1px solid #1c1c1c;border-radius:12px;padding:18px 17px;box-sizing:border-box;">'+
        '<div style="color:#777;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px;">Skóre po pilieroch</div>'+
        '<div style="display:flex;flex-direction:column;gap:13px;">'+renderScoreList(pcts)+'</div>'+
      '</div>'+
    '</div>'+
    '<div style="position:relative;margin-top:26px;min-height:400px;border-radius:12px;overflow:hidden;border:1px solid #1c1c1c;" id="lockBox">'+
      '<div style="filter:blur(5px);opacity:.5;padding:26px 22px;pointer-events:none;user-select:none;min-height:400px;">'+
        '<div style="color:#fff;font-size:14px;font-weight:600;margin-bottom:14px;">Tvoj 4-týždňový plán na mieru</div>'+
        '<div style="height:9px;width:88%;background:#2a2a2a;border-radius:4px;margin-bottom:10px;"></div>'+
        '<div style="height:9px;width:72%;background:#2a2a2a;border-radius:4px;margin-bottom:10px;"></div>'+
        '<div style="height:9px;width:81%;background:#2a2a2a;border-radius:4px;margin-bottom:10px;"></div>'+
        '<div style="height:9px;width:60%;background:#2a2a2a;border-radius:4px;margin-bottom:10px;"></div>'+
        '<div style="height:9px;width:75%;background:#2a2a2a;border-radius:4px;margin-bottom:10px;"></div>'+
        '<div style="height:9px;width:66%;background:#2a2a2a;border-radius:4px;margin-bottom:10px;"></div>'+
        '<div style="height:9px;width:84%;background:#2a2a2a;border-radius:4px;"></div>'+
      '</div>'+
      '<div id="lockOverlay" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(10,10,10,.35), rgba(10,10,10,.88));text-align:center;padding:24px 20px;">'+
        '<i class="ti ti-lock" style="font-size:22px;color:'+ACC+';margin-bottom:8px;"></i>'+
        '<div style="color:#fff;font-size:14px;font-weight:600;margin-bottom:4px;">Pulzové pásma, presné odporúčania a plán na 4 týždne</div>'+
        '<div style="color:#999;font-size:12px;margin-bottom:16px;max-width:340px;">Kompletný rozbor všetkých 12 odpovedí ti pošleme na email – vrátane tvojich osobných tréningových pásiem.</div>'+
        '<div style="width:100%;max-width:320px;">'+
          '<input id="nameIn" type="text" placeholder="Tvoje meno">'+
          '<input id="emailIn" type="email" placeholder="tvoj@email.sk">'+
          '<button id="sendBtn" style="width:100%;background:'+ACC+';border:none;color:#0a0a0a;padding:12px 24px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;">Poslať mi plný výsledok →</button>'+
          '<div style="display:flex;align-items:center;justify-content:center;gap:6px;color:#5c6885;font-size:10.5px;margin-top:9px;"><i class="ti ti-shield-check" style="font-size:12px;"></i>100 % bezpečné. Žiadny spam.</div>'+
        '</div>'+
      '</div>'+
    '</div>';

  var svg = document.getElementById('radar');
  drawRadar(svg, pcts);

  document.getElementById('sendBtn').addEventListener('click', submitEmail);
}

function buildEmailHtmlBlocks(pcts, weakestIdx){
  var weakestKey = ORDER[weakestIdx];
  var wc = PILLAR_LONG.WEAKEST[weakestKey];
  var pStyle = 'margin:0 0 10px 0;font-size:12.5px;line-height:1.7;color:#9aa5bd;';
  var mainHtml =
    '<div style=\"color:'+ACC+';font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;\">Tvoje hlavné obmedzenie</div>'+
    '<div style=\"margin:0 0 12px 0;font-size:20px;font-weight:700;color:#ffffff;line-height:1.3;\">'+PILLARS[weakestKey].label+' · '+pcts[weakestIdx]+'/100</div>'+
    wc.p.map(function(p){ return '<div style=\"'+pStyle+'\">'+p+'</div>'; }).join('')+
    '<div style=\"margin:10px 0 0 0;font-size:12px;line-height:1.6;color:#647089;font-style:italic;\">'+wc.t+'</div>';

  var otherHtml = ORDER.map(function(k, idx){
    if(idx === weakestIdx) return '';
    var oc = PILLAR_LONG.OTHER[k];
    var rank = rankInfo(pcts, idx);
    var suffix = rank === 'best' ? ' – tvoja najsilnejšia oblasť' : (rank === 'second_worst' ? ' – druhá najslabšia oblasť' : '');
    var border = rank === 'best' ? ACC : '#2a3648';
    return '<table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background-color:#0d1220;border:1px solid #1c2739;border-radius:10px;border-left:3px solid '+border+';margin-bottom:10px;\"><tr><td style=\"padding:16px 18px;\">'+
      '<div style=\"color:#ffffff;font-size:13px;font-weight:700;margin-bottom:8px;\">'+PILLARS[k].label+' · '+pcts[idx]+'/100'+suffix+'</div>'+
      oc.p.map(function(p){ return '<div style=\"'+pStyle+'\">'+p+'</div>'; }).join('')+
      '<div style=\"margin:2px 0 0 0;font-size:11.5px;line-height:1.6;color:#647089;font-style:italic;\">'+oc.t+'</div>'+
    '</td></tr></table>';
  }).join('');
  return {mainHtml: mainHtml, otherHtml: otherHtml};
}

async function submitEmail(){
  var name = document.getElementById('nameIn').value.trim();
  var email = document.getElementById('emailIn').value.trim();
  if(!email || !email.includes('@')){ alert('Prosím zadaj platný email.'); return; }
  userName = name; userEmail = email;
  if(typeof crypto !== 'undefined' && crypto.subtle){
    try{ userEmailHash = await sha256Hex(email.trim().toLowerCase()); }catch(e){}
  }
  if(typeof fbq !== 'undefined'){
    if(userEmailHash) fbq('init', PIXEL_ID, {em: userEmailHash});
    fbq('track', 'Lead');
  }
  var weakestLabel = PILLARS[ORDER[weakestIdx]].label;
  var pcts = pctsGlobal;
  var total = Math.round(pcts.reduce(function(a,b){return a+b;},0)/pcts.length);
  var blocks = buildEmailHtmlBlocks(pcts, weakestIdx);
  var radarUrl = 'https://ecomail-proxy.vercel.app/api/radar?p=' + pcts.join(',');
  var fields = {
    total: total,
    profileName: PROFILE_NAME[weakestIdx],
    score_vstup: pcts[ORDER.indexOf('vstup')],
    score_tech: pcts[ORDER.indexOf('tech')],
    score_tren: pcts[ORDER.indexOf('tren')],
    score_telo: pcts[ORDER.indexOf('telo')],
    score_poroz: pcts[ORDER.indexOf('poroz')],
    main_html: blocks.mainHtml,
    other_html: blocks.otherHtml,
    radar_url: radarUrl
  };
  fetch('https://ecomail-proxy.vercel.app/api/subscribe', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: email, name: name, profil: weakestLabel, fields: fields})
  }).catch(function(){});
  if(typeof fbq !== 'undefined') fbq('track', 'CompleteRegistration');
  var overlay = document.getElementById('lockOverlay');
  overlay.innerHTML =
    '<i class="ti ti-mail-opened" style="font-size:26px;color:'+ACC+';margin-bottom:10px;"></i>'+
    '<div style="color:#fff;font-size:15px;font-weight:700;margin-bottom:6px;">Skontroluj svoj email</div>'+
    '<div style="color:#999;font-size:12.5px;max-width:320px;line-height:1.5;">Plný výsledok s pulzovými pásmami a presnými odporúčaniami ti práve posielame na '+email+'.</div>';
}

function init(){
  var raw = sessionStorage.getItem('tpd_results');
  if(!raw){ renderNotFound(); return; }
  var data;
  try{ data = JSON.parse(raw); }catch(e){ renderNotFound(); return; }
  renderResult(data);
}
init();
</script>
